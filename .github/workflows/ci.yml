name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Estilo
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Publicar el build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
